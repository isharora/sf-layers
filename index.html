<body>

<script>
const B = window.BASE, ST = window.STORIES || { themes: {}, stories: [] };
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return Math.abs(n ^ (n >>> 15)); }

/* ---------- palette ---------- */
const ERAS = [
  { k: 'vic', label: 'Before 1906', cols: ['#d98f8a', '#8fb39f', '#e3bd67', '#97a6d3', '#c49bc4', '#e8a37b', '#7ea8b8', '#d7b18c'] },
  { k: 'edw', label: '1906–1929', cols: ['#eed6ad', '#e8cfc3', '#d3dfcb', '#d8d2e7', '#efdfa6', '#f0c9b0'] },
  { k: 'deco', label: '1930–1949', cols: ['#e6cca3', '#dcc5a3', '#e9d8bd'] },
  { k: 'mod', label: '1950–1979', cols: ['#b7bec4', '#a8b3bc', '#c5c1b6'] },
  { k: 'now', label: '1980–today', cols: ['#cdd6d1', '#d9d0c6', '#c9cfd8'] },
  { k: 'unk', label: 'Year unknown', cols: ['#e6dac3', '#e1d5bd'] },
];
const EK = {}; ERAS.forEach(e => EK[e.k] = e);
const eraOf = y => !y || y === 1900 ? 'unk' : y < 1906 ? 'vic' : y < 1930 ? 'edw' : y < 1950 ? 'deco' : y < 1980 ? 'mod' : 'now';
const BLOCK_TINT = { vic: '#e2a996', edw: '#ecd6a9', deco: '#e2c99c', mod: '#b9c3c8', now: '#cbd3cd', unk: '#e8ddc6' };
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16) * f)},${Math.round((n >> 8 & 255) * f)},${Math.round((n & 255) * f)})`; }
const WALL = {}; ERAS.forEach(e => e.cols.forEach(c => WALL[c] = shade(c, .72)));
const THEME_COL = {};

/* ---------- camera ---------- */
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, s: .05 };
const toS = (x, y) => [(x - cam.x) * cam.s + W / 2, (y - cam.y) * cam.s + H / 2];
const toM = (X, Y) => [(X - W / 2) / cam.s + cam.x, (Y - H / 2) / cam.s + cam.y];
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; dirty(); }
function fitCity() { const [x0, y0, x1, y1] = B.bounds; cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2; cam.s = Math.min(W / (x1 - x0), H / (y1 - y0)) * .92; }
const SMIN = .02, SMAX = 7, BLD_Z = .85, TREE_Z = 1.6, LABEL_Z = 1.05;

/* ---------- tiles ---------- */
const TILESET = new Set(B.tiles), TILES = new Map(), LOADING = new Set();
function visibleTiles(pad = 1) {
  const [x0, y0] = toM(0, 0), [x1, y1] = toM(W, H), T = B.tile, out = [];
  for (let i = Math.floor(x0 / T) - pad; i <= Math.floor(x1 / T) + pad; i++) for (let j = Math.floor(y0 / T) - pad; j <= Math.floor(y1 / T) + pad; j++) { const k = `${i}_${j}`; if (TILESET.has(k)) out.push([i, j, k]); }
  return out;
}
function decodeTile(raw, i, j) {
  const T = B.tile, ox = i * T, oy = j * T, blds = [];
  raw.b.forEach((a, n) => { const pts = new Float32Array(a.length - 2); let x = 0, y = 0; for (let k = 2; k < a.length; k += 2) { x += a[k]; y += a[k + 1]; pts[k - 2] = ox + x / 2; pts[k - 1] = oy + y / 2; }
    let cy = 0; for (let k = 1; k < pts.length; k += 2) cy += pts[k]; cy /= pts.length / 2;
    const e = EK[eraOf(a[0])], col = e.cols[hash(i * 7919 + j * 104729 + n) % e.cols.length];
    blds.push({ y: a[0], lift: Math.min(28, Math.max(3, a[1] * .38)), pts, cy, col, wall: WALL[col] }); });
  blds.sort((p, q) => p.cy - q.cy);
  const tr = new Float32Array(raw.t.length); for (let k = 0; k < raw.t.length; k += 2) { tr[k] = ox + raw.t[k] / 2; tr[k + 1] = oy + raw.t[k + 1] / 2; }
  return { blds, trees: tr };
}
function ensureTiles() {
  if (cam.s < BLD_Z * .8) return;
  for (const [i, j, k] of visibleTiles(1)) {
    if (TILES.has(k) || LOADING.has(k)) continue;
    LOADING.add(k);
    fetch(`city/tiles/${k}.json`).then(r => r.json()).then(raw => { TILES.set(k, decodeTile(raw, i, j)); LOADING.delete(k); dirty(); }).catch(() => LOADING.delete(k));
  }
  if (TILES.size > 260) { const keep = new Set(visibleTiles(2).map(v => v[2])); for (const k of TILES.keys()) if (!keep.has(k)) TILES.delete(k); }
}

/* ---------- time filter ---------- */
let YEAR = null; // null = all years

/* ---------- drawing helpers ---------- */
function pathRing(r) { const [x, y] = toS(r[0][0], r[0][1]); ctx.moveTo(x, y); for (let k = 1; k < r.length; k++) { const p = r[k]; ctx.lineTo((p[0] - cam.x) * cam.s + W / 2, (p[1] - cam.y) * cam.s + H / 2); } ctx.closePath(); }
function inView(bb, m = 0) { const [a, b] = toS(bb[0], bb[1]), [c, d] = toS(bb[2], bb[3]); return c >= -m && a <= W + m && d >= -m && b <= H + m; }
B.parks.forEach(p => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; p.p.forEach(r => r.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); })); p.bb = [x0, y0, x1, y1]; });
B.streets.forEach(s => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; s.p.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }); s.bb = [x0, y0, x1, y1]; });

// street labels: major streets from mid zoom, then everything once buildings are in view.
// Inside a neighbourhood view every street is named (only those inside it), drawn over the wash.
function drawStreetLabels(s) {
  if (s < (FOCUS ? .04 : .16)) return;
  {
    const minK = FOCUS ? (s >= .12 ? 1 : 2) : s >= LABEL_Z ? 1 : s >= .5 ? 2 : 3, placed = [];
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const order = B.labels.filter(l => (l[4] || 1) >= minK).sort((p, q) => (q[4] || 1) - (p[4] || 1));
    for (const [n, x, y, a, k = 1] of order) { const [X, Y] = toS(x, y); if (X < -150 || Y < -30 || X > W + 150 || Y > H + 30) continue;
      if (FOCUS && !FOCUS.p.some(r => inside([x, y], r))) continue;
      const major = k >= 3, fs = major ? Math.round(Math.min(15, 10.5 + s * 2.2)) : Math.round(Math.min(14, 8 + s * 2));
      ctx.font = `${major ? '600 ' : ''}${fs}px ${major ? 'Inter, system-ui, sans-serif' : '"IM Fell English SC", Georgia, serif'}`;
      const t = major ? n.toUpperCase().split('').join(' ') : n.toUpperCase().split('').join(' '), w = ctx.measureText(t).width;
      const r = a * Math.PI / 180, hw = Math.abs(Math.cos(r)) * w / 2 + Math.abs(Math.sin(r)) * fs / 2 + 4, hh = Math.abs(Math.sin(r)) * w / 2 + Math.abs(Math.cos(r)) * fs / 2 + 4;
      const box = [X - hw, Y - hh, X + hw, Y + hh];
      if (placed.some(q => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1])) continue; placed.push(box);
      ctx.save(); ctx.translate(X, Y); ctx.rotate(r);
      ctx.lineWidth = major ? 4.5 : 4; ctx.strokeStyle = major ? 'rgba(250,244,229,.95)' : '#f4ecd9'; ctx.fillStyle = major ? '#5a4632' : '#8a7356';
      ctx.strokeText(t, 0, 0); ctx.fillText(t, 0, 0); ctx.restore(); }
  }
}

/* ---------- render ---------- */
let need = true; function dirty() { need = true; }
function render() {
  need = false;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = cam.s;
  ctx.fillStyle = '#b7cbcf'; ctx.fillRect(0, 0, W, H);
  // land with a soft coastline halo
  ctx.beginPath(); B.land.forEach(pathRing);
  ctx.save(); ctx.shadowColor = 'rgba(80,110,115,.45)'; ctx.shadowBlur = 18; ctx.fillStyle = '#f4ecd9'; ctx.fill(); ctx.restore();
  ctx.lineWidth = 1.2; ctx.strokeStyle = '#8fa9ad'; ctx.stroke();
  // blocks
  const showB = s >= BLD_Z;
  for (const b of B.blocks) {
    if (!inView(b.bb, 20)) continue;
    ctx.beginPath(); b.p.forEach(pathRing);
    const tint = YEAR && b.old && b.old > YEAR ? '#ece3cf' : showB ? '#e4d7bb' : BLOCK_TINT[b.dom];
    ctx.fillStyle = tint; ctx.fill();
    if (s > .12) { ctx.lineWidth = Math.min(3, s * 2.4); ctx.strokeStyle = tint; ctx.lineJoin = 'round'; ctx.stroke(); }
  }
  // parks, sand, water
  for (const p of B.parks) {
    if (!inView(p.bb, 10)) continue;
    ctx.beginPath(); p.p.forEach(pathRing);
    ctx.fillStyle = p.k === 'water' ? '#b7cbcf' : p.k === 'sand' ? '#eadbb2' : p.k === 'golf' ? '#c3d6a0' : '#b8cf95'; ctx.fill();
    if (p.k !== 'sand') { ctx.lineWidth = .8; ctx.strokeStyle = p.k === 'water' ? '#8fa9ad' : '#94b073'; ctx.stroke(); }
  }
  // paths in parks
  if (s > 1.1) { ctx.setLineDash([1.2 * s, 4 * s]); ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1, 1.6 * s); ctx.strokeStyle = 'rgba(245,236,212,.95)';
    for (const st of B.streets) { if (st.k !== 0 || !inView(st.bb, 10)) continue; ctx.beginPath(); st.p.forEach(([x, y], k) => { const X = (x - cam.x) * s + W / 2, Y = (y - cam.y) * s + H / 2; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); }
    ctx.setLineDash([]); }
  // freeways at every zoom (helps orientation)
  if (s < BLD_Z) { ctx.lineWidth = Math.max(1, 6 * s); ctx.strokeStyle = 'rgba(255,248,232,.85)'; ctx.lineCap = 'round';
    for (const st of B.streets) { if (st.k < 3 || !inView(st.bb, 10)) continue; ctx.beginPath(); st.p.forEach(([x, y], k) => { const X = (x - cam.x) * s + W / 2, Y = (y - cam.y) * s + H / 2; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); } }
  // buildings
  if (showB) {
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.min(.8, .35 + s * .12); ctx.strokeStyle = 'rgba(74,59,48,.85)';
    const vt = visibleTiles(0).map(v => TILES.get(v[2])).filter(Boolean);
    const all = []; vt.forEach(t => t.blds.forEach(b => all.push(b)));
    if (vt.length > 1) all.sort((p, q) => p.cy - q.cy);
    const [mx0, my0] = toM(-40, -40), [mx1, my1] = toM(W + 40, H + 80);
    for (const b of all) {
      const p = b.pts; if (b.cy < my0 || b.cy > my1 || p[0] < mx0 - 80 || p[0] > mx1 + 80) continue;
      const faded = YEAR && b.y && b.y !== 1900 && b.y > YEAR;
      ctx.globalAlpha = faded ? .08 : 1;
      const L = b.lift * s;
      ctx.beginPath(); for (let k = 0; k < p.length; k += 2) { const X = (p[k] - cam.x) * s + W / 2, Y = (p[k + 1] - cam.y) * s + H / 2; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.closePath();
      ctx.fillStyle = b.wall; ctx.fill(); if (s > 1.2) ctx.stroke();
      ctx.beginPath(); for (let k = 0; k < p.length; k += 2) { const X = (p[k] - cam.x) * s + W / 2, Y = (p[k + 1] - cam.y) * s + H / 2 - L; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.closePath();
      ctx.fillStyle = b.col; ctx.fill(); if (s > .95) ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (s >= TREE_Z) {
      const G = ['#7fa35f', '#8fb06a', '#6f9656', '#97b873'];
      for (const t of vt) { const tr = t.trees; for (let k = 0; k < tr.length; k += 2) { const X = (tr[k] - cam.x) * s + W / 2, Y = (tr[k + 1] - cam.y) * s + H / 2; if (X < -20 || Y < -20 || X > W + 20 || Y > H + 20) continue; const r = (2.6 + (k % 7) / 5) * s;
        ctx.fillStyle = 'rgba(79,94,55,.2)'; ctx.beginPath(); ctx.arc(X + .9 * s, Y + 1.2 * s, r, 0, 7); ctx.fill(); ctx.fillStyle = G[(k >> 1) % 4]; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; } }
    }
  }
  if (!FOCUS) drawStreetLabels(s);
  // neighbourhood focus: wash out the rest of the city and outline the chosen one
  if (FOCUS) {
    ctx.beginPath(); ctx.rect(0, 0, W, H); FOCUS.p.forEach(pathRing);
    ctx.fillStyle = 'rgba(232,222,199,.8)'; ctx.fill('evenodd');
    ctx.beginPath(); FOCUS.p.forEach(pathRing); ctx.setLineDash([7, 5]); ctx.lineWidth = 2.2; ctx.strokeStyle = '#9c3b33'; ctx.stroke(); ctx.setLineDash([]);

    drawStreetLabels(s);
  }
  // landmarks
  if (s >= 1.2) for (const l of B.landmarks) { if (!l.no) continue; const [X, Y] = toS(l.c[0], l.c[1]); if (X < -20 || Y < -20 || X > W + 20 || Y > H + 20) continue; const r = Math.min(9, 4 + s * 3); ctx.fillStyle = '#fbf1d6'; ctx.strokeStyle = '#b8903f'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(X, Y - r, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#9c3b33'; ctx.beginPath(); ctx.arc(X, Y - r, r * .35, 0, 7); ctx.fill(); }
  if (TOUR) drawTourPath();
  drawPins();
  // neighbourhood names
  if (s < 1.6 && !FOCUS) {
    const a = s < BLD_Z ? .85 : Math.max(0, .85 - (s - BLD_Z) * 1.2);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const placed = [];
    for (const h of [...B.hoods].sort((p, q) => q.a - p.a)) { const [X, Y] = toS(h.c[0], h.c[1]); if (X < -200 || Y < -40 || X > W + 200 || Y > H + 40) continue;
      const fs = Math.max(10, Math.min(28, 8 + Math.sqrt(h.a) * s * 50));
      ctx.font = `${fs}px "IM Fell English SC", Georgia, serif`;
      const t = h.n.replace('Financial District/South Beach', 'Financial District').replace('Oceanview/Merced/Ingleside', 'Ingleside').replace('Castro/Upper Market', 'Castro').toUpperCase().split('').join('\u200A');
      const w = ctx.measureText(t).width, box = [X - w / 2 - 6, Y - fs * .65, X + w / 2 + 6, Y + fs * .65];
      if (placed.some(q => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1])) continue;
      placed.push(box); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(244,236,217,.9)'; ctx.fillStyle = '#6b4f36'; ctx.strokeText(t, X, Y); ctx.fillText(t, X, Y); }
    ctx.globalAlpha = 1;
  }
}

/* ---------- story pins ---------- */
const S = ST.stories, SBY = {}; S.forEach(s => SBY[s.id] = s);
const TH = ST.themes;
const col = s => (TH[s.theme] || {}).color || '#8a6d3b';
let SEL = null, HOV = null, PINSCR = [];
let OFF = new Set();            // themes hidden from the map
let HERE = null, NEAR = null;   // searched address and the stories nearest to it
let FOCUS = null;               // neighbourhood being explored on its own
let TOUR = null, TOURSET = null; // walking tour in progress: { t, i } (i = -1 on the overview)
let WALK = null;                // walk mode: live GPS position
function pinVisible(s) { return (!YEAR || s.year <= YEAR) && !OFF.has(s.theme) && (!FOCUS || FOCUS.ids.has(s.id)); }
function pinShape(st, X, Y, r, sel, hov, dim) {
  ctx.save(); ctx.translate(X, Y); ctx.globalAlpha = dim ? .28 : 1;
  if (sel || hov) { ctx.shadowColor = sel ? 'rgba(255,230,150,.95)' : 'rgba(60,40,20,.35)'; ctx.shadowBlur = sel ? 14 : 6; ctx.shadowOffsetY = sel ? 0 : 3; }
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-r * .25, -r * .5, -r, -r, -r, -r * 1.75); ctx.arc(0, -r * 1.75, r, Math.PI, 0); ctx.bezierCurveTo(r, -r, r * .25, -r * .5, 0, 0); ctx.closePath();
  ctx.fillStyle = col(st); ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.6; ctx.strokeStyle = '#fff8e8'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -r * 1.75, r * .45, 0, 7); ctx.fillStyle = '#fff8e8'; ctx.fill(); ctx.restore();
}
let CARD = null; // while drawing a share card: only this story's pin, drawn large
function drawPins() {
  if (CARD) { PINSCR = []; if (CARD.pin) { const [X, Y] = toS(CARD.pin.c[0], CARD.pin.c[1]); pinShape(CARD.pin, X, Y, 34, true, false, false); } if (TOUR && CARD.tour) drawTourStops(); return; }
  PINSCR = []; const s = cam.s, big = s >= .3 || !!FOCUS, R = big ? Math.min(13, 7 + s * 3.2) : 3.4;
  const pts = [];
  for (const st of S) { if (!pinVisible(st) || (TOUR && TOURSET.has(st.id))) continue; const [X, Y] = toS(st.c[0], st.c[1]); if (X < -30 || Y < -40 || X > W + 30 || Y > H + 30) continue; pts.push([st, X, Y]); }
  pts.sort((p, q) => (NEAR ? (NEAR.has(p[0].id) - NEAR.has(q[0].id)) : 0) || p[2] - q[2]);
  for (const [st, X, Y] of pts) {
    const hov = st.id === HOV, sel = st.id === SEL, near = NEAR && NEAR.has(st.id);
    const dim = (YEAR && (st.yearEnd || st.year) < YEAR - 25) || (NEAR && !near && !sel) || !!TOUR;
    if (big || sel || near) { const r = (big ? R : 8) * (sel ? 1.35 : hov ? 1.25 : 1); pinShape(st, X, Y, r, sel, hov, dim); PINSCR.push([st, X, Y - r * 1.6, r * 1.5]); }
    else { const r = R * (hov ? 1.5 : 1); ctx.globalAlpha = dim ? .28 : 1; ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fillStyle = col(st); ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#fff8e8'; ctx.stroke(); PINSCR.push([st, X, Y, 6]); }
  }
  ctx.globalAlpha = 1;
  if (HERE) { // the searched address: a gold compass star with a soft ring
    const [X, Y] = toS(HERE.x, HERE.y);
    ctx.beginPath(); ctx.arc(X, Y, 22, 0, 7); ctx.fillStyle = 'rgba(156,59,51,.12)'; ctx.fill(); ctx.strokeStyle = 'rgba(156,59,51,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save(); ctx.translate(X, Y); ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2, rr = k % 2 ? 5 : 13; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath();
    ctx.fillStyle = '#9c3b33'; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 1.6; ctx.strokeStyle = '#fff8e8'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fillStyle = '#fff8e8'; ctx.fill(); ctx.restore();
  }
  if (TOUR) drawTourStops();

document.getElementById('wbCenter').onclick = () => { if (!WALK) return; WALK.follow = true; document.getElementById('wbCenter').style.display = 'none'; if (WALK.pos) flyTo(WALK.pos[0], WALK.pos[1], Math.max(cam.s, 1.8), 600); };

/* ---------- share cards: a map snapshot + the story, as an image and a link ---------- */
async function snapshot(x, y, s, w, h) {
  const save = { ctx, W, H, DPR, x: cam.x, y: cam.y, s: cam.s, HOV };
  const swap = () => { cam.x = x; cam.y = y; cam.s = s; W = w; H = h; DPR = 1; HOV = null; };
  const back = () => { ctx = save.ctx; W = save.W; H = save.H; DPR = save.DPR; cam.x = save.x; cam.y = save.y; cam.s = save.s; HOV = save.HOV; dirty(); };
  swap(); const need = s >= BLD_Z * .8 ? visibleTiles(0) : []; back();
  await Promise.all(need.filter(([, , k]) => !TILES.has(k)).map(([i, j, k]) => fetch(`city/tiles/${k}.json`).then(r => r.json()).then(raw => TILES.set(k, decodeTile(raw, i, j))).catch(() => { })));
  const off = document.createElement('canvas'); off.width = w; off.height = h;
  const a = anim; anim = null; swap(); ctx = off.getContext('2d');
  try { render(); } finally { back(); anim = a; }
  return off;
}
function wrap(g, text, maxW, maxLines) {
  const words = text.split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; let l = lines[maxLines - 1]; while (g.measureText(l + '…').width > maxW && l.includes(' ')) l = l.slice(0, l.lastIndexOf(' ')); lines[maxLines - 1] = l.replace(/[,;:.]$/, '') + '…'; }
  return lines;
}
async function makeCard({ kicker, color, title, sub, place, view }) {
  await Promise.all(['600 74px "Cormorant Garamond"', 'italic 500 42px "Cormorant Garamond"', '26px "IM Fell English SC"', '600 24px Inter', '500 22px Inter'].map(f => document.fonts.load(f).catch(() => { })));
  const Wc = 1080, Hc = 1350, c = document.createElement('canvas'); c.width = Wc; c.height = Hc; const g = c.getContext('2d');
  g.fillStyle = '#f4ecd9'; g.fillRect(0, 0, Wc, Hc);
  const map = await snapshot(view.x, view.y, view.s, 1000, 690);
  g.save(); g.beginPath(); g.roundRect(40, 40, 1000, 690, 18); g.clip(); g.drawImage(map, 40, 40);
  const vg = g.createRadialGradient(540, 385, 250, 540, 385, 640); vg.addColorStop(0, 'rgba(59,42,24,0)'); vg.addColorStop(1, 'rgba(59,42,24,.22)'); g.fillStyle = vg; g.fillRect(40, 40, 1000, 690); g.restore();
  g.lineWidth = 3; g.strokeStyle = '#b8903f'; g.beginPath(); g.roundRect(40, 40, 1000, 690, 18); g.stroke();
  let y = 800;
  g.fillStyle = color; g.font = '600 24px Inter, system-ui, sans-serif'; if ('letterSpacing' in g) g.letterSpacing = '3px';
  g.fillText(wrap(g, kicker.toUpperCase(), 960, 1)[0], 60, y); if ('letterSpacing' in g) g.letterSpacing = '0px';
  g.fillStyle = '#3d3026'; g.font = '600 74px "Cormorant Garamond", Georgia, serif';
  for (const l of wrap(g, title, 960, 2)) { y += 80; g.fillText(l, 60, y); }
  if (place) { y += 50; g.fillStyle = '#6e5a47'; g.font = '500 24px Inter, system-ui, sans-serif'; g.fillText(wrap(g, '📍 ' + place, 960, 1)[0], 60, y); }
  y += 24; g.fillStyle = '#5a4632'; g.font = 'italic 500 42px "Cormorant Garamond", Georgia, serif';
  for (const l of wrap(g, sub, 960, Math.max(1, Math.floor((Hc - 150 - y) / 54)))) { y += 54; g.fillText(l, 60, y); }
  g.strokeStyle = '#d6c49c'; g.lineWidth = 2; g.beginPath(); g.moveTo(60, Hc - 100); g.lineTo(Wc - 60, Hc - 100); g.stroke();
  g.fillStyle = '#8a6d3b'; g.font = '26px "IM Fell English SC", Georgia, serif'; if ('letterSpacing' in g) g.letterSpacing = '5px'; g.fillText('LAYERS · SAN FRANCISCO IN TIME', 60, Hc - 52); if ('letterSpacing' in g) g.letterSpacing = '0px';
  g.fillStyle = '#9c3b33'; g.font = '600 22px Inter, system-ui, sans-serif'; g.textAlign = 'right'; g.fillText('isharora.github.io/sf-layers', Wc - 60, Hc - 52);
  return c;
}
const shareM = document.getElementById('shareM');
function closeShare() { shareM.classList.remove('on'); const i = document.getElementById('shImg'); if (i.src.startsWith('blob:')) URL.revokeObjectURL(i.src); }
document.getElementById('shX').onclick = closeShare; shareM.addEventListener('click', e => { if (e.target === shareM) closeShare(); });
async function openShare({ card, url, title, text, file }) {
  const img = document.getElementById('shImg'), msg = document.getElementById('shMsg'), btns = document.getElementById('shBtns');
  img.removeAttribute('src'); msg.textContent = 'Drawing your card…'; btns.innerHTML = ''; shareM.classList.add('on');
  let blob;
  try { const c = await card(); blob = await new Promise(r => c.toBlob(r, 'image/png')); img.src = URL.createObjectURL(blob); msg.textContent = ''; }
  catch (e) { msg.textContent = 'Couldn’t draw the image, but the link still works.'; }
  const f = blob ? new File([blob], file, { type: 'image/png' }) : null;
  const canFile = f && navigator.canShare && navigator.canShare({ files: [f] });
  btns.innerHTML = `${canFile || navigator.share ? '<button class="bigbtn" id="shNative">Share…</button>' : ''}${blob ? '<button class="bigbtn alt" id="shDl">Download image</button>' : ''}<button class="bigbtn alt" id="shCopy">Copy link</button><a class="bigbtn alt" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}">Post on X</a>`;
  const nat = document.getElementById('shNative');
  if (nat) nat.onclick = async () => { try { await navigator.share(canFile ? { files: [f], title, text: text + ' ' + url } : { title, text, url }); } catch (_) { } };
  const dl = document.getElementById('shDl'); if (dl) dl.onclick = () => { const a = document.createElement('a'); a.href = img.src; a.download = file; a.click(); };
  document.getElementById('shCopy').onclick = async () => { try { await navigator.clipboard.writeText(url); msg.textContent = 'Link copied.'; } catch (_) { msg.textContent = url; } };
}
const baseUrl = () => location.origin + location.pathname;
function shareStory(s) {
  const prevSel = SEL;
  openShare({ url: `${baseUrl()}#story=${s.id}`, title: s.title, text: `${s.title} (${s.year}), ${s.place}`, file: `${s.id}.png`,
    card: async () => { SEL = s.id; CARD = { pin: s }; try { return await makeCard({ kicker: `${s.year}${s.yearEnd ? '–' + s.yearEnd : ''} · ${(TH[s.theme] || {}).label || ''} · ${s.hood || ''}`, color: col(s), title: s.title, sub: s.hook, place: s.place, view: { x: s.c[0], y: s.c[1] - 22, s: 2.3 } }); } finally { SEL = prevSel; CARD = null; } } });
}
function shareTour(t) {
  const bx = tourBox(t), sc = Math.min(1.6, Math.min(1000 / (bx[2] - bx[0]), 690 / (bx[3] - bx[1])) * .82);
  openShare({ url: `${baseUrl()}#tour=${t.id}`, title: t.title, text: `${t.title}: a ${fmtDist(t.m)} walking tour of ${t.hood}`, file: `${t.id}.png`,
    card: async () => { const was = TOUR; if (!was) { TOUR = { t, i: -1 }; TOURSET = new Set(t.stops.map(x => x.id)); } CARD = { tour: true }; try { return await makeCard({ kicker: `Walking tour · ${t.stops.length} stops · ${fmtDist(t.m)} · ${t.hood}`, color: tourCol(t), title: t.title, sub: t.tagline, place: '', view: { x: (bx[0] + bx[2]) / 2, y: (bx[1] + bx[3]) / 2, s: sc } }); } finally { CARD = null; if (!was) endTourState(); } } });
}

/* ---------- theme key: doubles as a map filter ---------- */
const tkey = document.getElementById('themekey');
function drawThemeKey() {
  const n = {}; S.forEach(s => n[s.theme] = (n[s.theme] || 0) + 1);
  tkey.innerHTML = `<h4 id="tkH"><span>Story themes</span><span>${tkey.classList.contains('min') ? '+' : '−'}</span></h4><div class="list">${Object.entries(TH).filter(([k]) => n[k]).map(([k, v]) => `<button data-k="${k}" class="${OFF.has(k) ? 'off' : ''}" title="Click to show only this theme; click again to show all"><i style="background:${v.color}"></i>${esc(v.label)}<span class="n">${n[k]}</span></button>`).join('')}
    ${OFF.size ? '<button class="all" id="tkAll">Show all themes</button>' : ''}</div>`;
  document.getElementById('tkH').onclick = () => { tkey.classList.toggle('min'); drawThemeKey(); };
  tkey.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, keys = Object.keys(TH).filter(t => n[t]), only = OFF.size === keys.length - 1 && !OFF.has(k);
    OFF = only ? new Set() : new Set(keys.filter(t => t !== k)); drawThemeKey(); dirty();
  });
  const all = document.getElementById('tkAll'); if (all) all.onclick = () => { OFF = new Set(); drawThemeKey(); dirty(); };
}
drawThemeKey();

/* ---------- time ---------- */
const ERA_TXT = [[1776, 'Yelamu homeland, the Presidio and Mission Dolores'], [1848, 'Gold Rush: a village becomes a city'], [1870, 'The Victorian city spreads west'], [1906, 'Earthquake, fire and rebuilding'], [1915, 'A world’s fair city'], [1941, 'Wartime boom'], [1950, 'Freeways and redevelopment'], [1965, 'Counterculture and liberation'], [1989, 'Loma Prieta and the new waterfront'], [2000, 'The city today']];
const slider = document.getElementById('slider'), allY = document.getElementById('allYears');
function setYear(y) { slider.value = y; allY.checked = false; applyYear(); }
function applyYear() { YEAR = allY.checked ? null : +slider.value; document.getElementById('yr').textContent = YEAR || 'All years'; document.getElementById('eraTxt').textContent = YEAR ? [...ERA_TXT].reverse().find(([a]) => YEAR >= a)[1] : 'Drag back in time'; dirty(); }
slider.addEventListener('input', () => { allY.checked = false; applyYear(); }); allY.addEventListener('change', applyYear);

/* ---------- legend + texture ---------- */
document.getElementById('legend').innerHTML = `<h4>When it was built</h4>` + ERAS.map(e => `<div class="row"><span class="sw" style="background:linear-gradient(90deg,${e.cols.slice(0, 3).join(',')})"></span>${e.label}</div>`).join('');
(function texture() { const c = document.createElement('canvas'); c.width = c.height = 200; const g = c.getContext('2d'), d = g.createImageData(200, 200); for (let i = 0; i < d.data.length; i += 4) { const v = 200 + Math.random() * 55; d.data[i] = v; d.data[i + 1] = v * .96; d.data[i + 2] = v * .88; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); document.getElementById('tex').style.background = `url(${c.toDataURL()})`; })();

/* ---------- loop ---------- */
function loop(t) { if (anim) anim(t); if (need) { ensureTiles(); render(); } requestAnimationFrame(loop); }
resize(); fitCity();
const hs = new URLSearchParams(location.hash.slice(1));
if (hs.get('hood')) { const h = [...B.hoods, ...AREAS].find(x => x.slug === hs.get('hood')); if (h) setTimeout(() => enterHood(h.n, true), 200); }
if (hs.get('tour')) setTimeout(() => startTour(hs.get('tour'), hs.get('stop') ? +hs.get('stop') - 1 : -1, true), 250);
if (hs.get('story') && SBY[hs.get('story')]) setTimeout(() => openStory(hs.get('story'), true), 300);
document.getElementById('loading').remove();
requestAnimationFrame(loop);
</script>
