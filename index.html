<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Layers: San Francisco in Time</title>
<meta name="description" content="An illustrated, time-travelling map of San Francisco: every building coloured by when it was built, and hundreds of sourced stories pinned to the places they happened.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IM+Fell+English+SC&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3d3026; --ink-2: #6e5a47; --gold: #b8903f; --rose: #9c3b33; --display: "Cormorant Garamond", Georgia, serif; --caps: "IM Fell English SC", Georgia, serif; --ui: Inter, -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b7cbcf; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #cv.drag { cursor: grabbing; } #cv.hand { cursor: pointer; }
  .texture { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }

  @keyframes drift { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
  .cartouche { position: fixed; left: 18px; top: 16px; background: rgba(248,240,220,.96); border: 2px solid #b8903f; border-radius: 10px; padding: 12px 20px 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.2); pointer-events: none; }

  .cartouche .s { font: 15px var(--display); color: var(--ink-2); margin-top: 2px; }
  .topbar { position: fixed; top: 16px; right: 18px; display: flex; gap: 8px; z-index: 5; align-items: center; }
  .topbar button, .search { font: 600 13px var(--ui); color: var(--ink); background: rgba(243,234,214,.97); border: 1px solid #c9b58a; border-radius: 999px; padding: 9px 16px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .topbar button.pri { background: #3d3026; color: #f6eedb; border-color: #3d3026; }
  .search { width: 240px; cursor: text; font-weight: 500; outline: none; }
  .results { position: fixed; top: 58px; right: 18px; width: 360px; max-height: 60vh; overflow: auto; background: #fbf5e6; border: 1px solid #d6c49c; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.25); display: none; z-index: 6; }
  .results.on { display: block; }
  .results div { padding: 9px 14px; border-bottom: 1px solid #eadcbc; cursor: pointer; font: 13.5px var(--ui); color: var(--ink); }
  .results div:hover { background: #f3e7c9; } .results small { color: #9b8561; display: block; }
  .legend { position: fixed; left: 18px; bottom: 18px; background: rgba(243,234,214,.96); border: 1px solid #c9b58a; border-radius: 12px; padding: 12px 14px; font: 12px var(--ui); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .legend h4 { margin: 0 0 8px; font: 600 10.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }

  .zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid #c9b58a; background: rgba(243,234,214,.96); font: 600 18px var(--ui); color: var(--ink); cursor: pointer; }
  .timebar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(620px, calc(100% - 320px)); background: rgba(243,234,214,.96); border: 1px solid #c9b58a; border-radius: 14px; padding: 10px 18px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.22); z-index: 4; }

  .timebar input[type=range] { width: 100%; accent-color: #9c3b33; margin: 6px 0 0; }

  @media (max-width: 860px) { .timebar { width: calc(100% - 24px); bottom: 70px; } .legend, .cartouche .s { display: none; } .search { width: 150px; } .cartouche h1 { font-size: 22px; } }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(430px, 100%); background: #f6eedb; box-shadow: -20px 0 60px rgba(0,0,0,.3); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); overflow-y: auto; color: var(--ink); z-index: 10; }
  .drawer.open { transform: none; }

  .hd { padding: 26px 26px 14px; border-bottom: 1px solid #decfae; }

  .hd .sub { font: italic 18px var(--display); color: var(--ink-2); }
  .bd { padding: 18px 26px 40px; font: 18px/1.5 var(--display); }
  .stat { font: 13px var(--ui); color: var(--ink-2); }
  .era-bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .chip { display: inline-block; font: 500 12px var(--ui); padding: 3px 9px; border-radius: 999px; background: #eadcbc; margin: 3px 4px 0 0; color: var(--ink); }

  .lmcard { margin: 10px 0; padding: 12px 14px; background: #fbf5e6; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; }
  .lmcard b { font: 600 19px var(--display); } .lmcard a { font: 12px var(--ui); color: var(--rose); }
  .scard { margin: 12px 0; padding: 14px 16px; background: #fbf5e6; border-radius: 10px; border-left: 4px solid var(--c, #b8903f); cursor: pointer; }
  .scard:hover { background: #fffaf0; }
  .scard .t { font: 600 21px/1.2 var(--display); }
  .scard .m { font: 500 11.5px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--c, #8a6d3b); margin-bottom: 3px; }
  .scard .h { font: italic 17px/1.4 var(--display); color: var(--ink-2); margin-top: 4px; }
  .story-v .m { font: 600 11.5px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
  .story-v h2 { font: 600 34px/1.1 var(--display); margin: 6px 0 6px; }
  .story-v .place { font: 13px var(--ui); color: var(--ink-2); }
  .story-v .hook { font: italic 21px/1.45 var(--display); margin: 16px 0 12px; padding-left: 14px; border-left: 3px solid var(--c); }
  .story-v .txt { font: 19px/1.6 var(--display); }
  .story-v sup a { font: 600 11px var(--ui); color: var(--rose); text-decoration: none; }
  .story-v .src { font: 12.5px/1.5 var(--ui); color: var(--ink-2); margin-top: 18px; padding-top: 12px; border-top: 1px solid #decfae; }
  .story-v .src ol { padding-left: 18px; margin: 6px 0 0; } .story-v .src a { color: var(--rose); }
  .story-v img { width: 100%; border-radius: 8px; margin: 12px 0 4px; }
  .navrow { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
  .navrow button, .backbtn { font: 500 13px var(--ui); color: var(--ink); background: #fbf5e6; border: 1px solid #d6c49c; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .tfil { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .tfil button, .tfil select { font: 500 12px var(--ui); border-radius: 999px; padding: 4px 10px; border: 1px solid #d6c49c; background: #fbf5e6; cursor: pointer; color: var(--ink); }
  .tfil button.on { background: #3d3026; color: #f6eedb; border-color: #3d3026; }
  .peek { position: fixed; z-index: 8; width: 300px; pointer-events: none; background: #fbf5e6; color: var(--ink); border-radius: 12px; border: 1px solid #d9c79f; box-shadow: 0 14px 36px rgba(40,25,10,.3); padding: 12px 14px 13px; border-top: 4px solid var(--c, #b8903f); opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .16s ease, transform .16s ease; }
  .peek.on { opacity: 1; transform: none; }
  .peek .m { font: 600 10.5px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
  .peek .t { font: 600 21px/1.15 var(--display); margin: 3px 0 5px; }
  .peek .h { font: italic 16px/1.4 var(--display); color: var(--ink-2); }
  .peek .p { font: 11.5px var(--ui); color: #9b8561; margin-top: 7px; }
  .peek .cta { font: 600 11px var(--ui); color: var(--rose); margin-top: 6px; }
  .results div.act { background: #f3e7c9; } .results .grp { padding: 6px 14px 4px; font: 600 10px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: #9b8561; background: #f6eedb; cursor: default; }
  .results div.grp:hover { background: #f6eedb; }
  .themekey { position: fixed; left: 18px; top: 222px; background: rgba(243,234,214,.96); border: 1px solid #c9b58a; border-radius: 12px; padding: 10px 10px 8px; font: 12px var(--ui); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.2); width: 224px; }
  .themekey h4 { margin: 0 4px 6px; font: 600 10.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; cursor: pointer; }
  .themekey button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: 12px var(--ui); color: var(--ink); background: none; border: 0; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
  .themekey button:hover { background: #eadcbc; } .themekey button.off { opacity: .35; } .themekey button .n { margin-left: auto; color: #9b8561; font-size: 11px; }
  .themekey i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .themekey .all { font: 600 11px var(--ui); color: var(--rose); margin: 4px 4px 0; cursor: pointer; background: none; border: 0; padding: 0; }
  .themekey.min .list { display: none; }
  .near-d { font: 600 11px var(--ui); color: var(--ink-2); letter-spacing: .04em; float: right; margin-left: 8px; }
  .youare { display: flex; gap: 10px; align-items: center; margin: 6px 0 4px; font: 13px/1.45 var(--ui); color: var(--ink-2); }
  @media (max-width: 860px) { .themekey { display: none; } }
  .quick { position: fixed; left: 18px; top: 128px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 330px; z-index: 3; }
  .quick a, .quick button { font: 600 12px var(--ui); color: var(--ink-2); background: rgba(243,234,214,.94); border: 1px solid #c9b58a; border-radius: 999px; padding: 6px 12px; text-decoration: none; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.14); }
  .quick a:hover, .quick button:hover { background: #fbf5e6; color: var(--ink); }
  .quick .on { background: #3d3026; color: #f6eedb; border-color: #3d3026; }
  .quick .lbl { font: 600 10px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); width: 100%; margin: 0 0 1px 4px; text-shadow: 0 1px 0 rgba(255,250,235,.8); }
  .backbar { position: fixed; left: 18px; top: 130px; display: none; align-items: center; gap: 12px; background: #3d3026; color: #f6eedb; border-radius: 999px; padding: 6px 8px 6px 6px; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 6; font: 13px var(--ui); white-space: nowrap; }
  .backbar.on { display: flex; }
  .backbar button { font: 600 13px var(--ui); background: #f6eedb; color: #3d3026; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .backbar b { font: italic 600 19px var(--display); letter-spacing: .01em; }
  .backbar span { color: #d8c8a6; padding-right: 10px; }
  .quick.hide { display: none; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); font: italic 22px var(--display); color: var(--ink); background: rgba(248,240,220,.95); padding: 14px 24px; border-radius: 12px; border: 1px solid #c9b58a; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="texture" id="tex"></div><div class="fog"></div><div class="vignette"></div>
<div class="cartouche"><div class="k">LAYERS · A MAP IN TIME</div><h1>San Francisco</h1><div class="s">Every block, every era. Zoom in to explore.</div></div>
<nav class="quick" id="quick" aria-label="Jump to a neighbourhood"><div class="lbl">Jump to</div></nav>
<div class="backbar" id="backbar"><button id="backBtn">← All of San Francisco</button><b id="bbName"></b><span id="bbStat"></span></div>
<div class="topbar"><input class="search" id="search" placeholder="Search any address or story" aria-label="Search addresses, places and stories" autocomplete="off" spellcheck="false"><button id="meBtn" title="Stories near where you are">📍 Near me</button><button class="pri" id="tourBtn">Walk through time</button><button id="storiesBtn">All stories</button></div>
<div class="results" id="results"></div>
<div class="legend" id="legend"></div>
<div class="themekey" id="themekey"></div>
<div class="timebar"><div class="row1"><span class="yr" id="yr">All years</span><span class="era" id="eraTxt">Drag back in time</span><label><input type="checkbox" id="allYears" checked> All years</label></div>
<input type="range" id="slider" min="1776" max="2026" step="1" value="2026" aria-label="Year"><div class="ticks"><span>1776</span><span>1849</span><span>1906</span><span>1942</span><span>1967</span><span>1989</span><span>today</span></div></div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
<div class="peek" id="peek"></div>
<aside class="drawer" id="drawer"><button class="close" id="close" aria-label="Close">✕</button><div id="dbody"></div></aside>
<div class="loading" id="loading">Unrolling the map…</div>

<script src="city/base.js"></script>
<script src="city/stories.js"></script>
<script>
const B = window.BASE, ST = window.STORIES || { themes: {}, stories: [] };
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return Math.abs(n ^ (n >>> 15)); }

/* ---------- palette ---------- */
const ERAS = [
  { k: 'vic', label: 'Before 1906', cols: ['#d98f8a', '#8fb39f', '#e3bd67', '#97a6d3', '#c49bc4', '#e8a37b', '#7ea8b8', '#d7b18c'] },
  { k: 'edw', label: '1906–1929', cols: ['#eed6ad', '#e8cfc3', '#d3dfcb', '#d8d2e7', '#efdfa6', '#f0c9b0'] },
  { k: 'deco', label: '1930–1949', cols: ['#e6cca3', '#dcc5a3', '#e9d8bd'] },
  { k: 'mod', label: '1950–1979', cols: ['#b7bec4', '#a8b3bc', '#c5c1b6'] },
  { k: 'now', label: '1980–today', cols: ['#cdd6d1', '#d9d0c6', '#c9cfd8'] },
  { k: 'unk', label: 'Year unknown', cols: ['#e6dac3', '#e1d5bd'] },
];
const EK = {}; ERAS.forEach(e => EK[e.k] = e);
const eraOf = y => !y || y === 1900 ? 'unk' : y < 1906 ? 'vic' : y < 1930 ? 'edw' : y < 1950 ? 'deco' : y < 1980 ? 'mod' : 'now';
const BLOCK_TINT = { vic: '#e2a996', edw: '#ecd6a9', deco: '#e2c99c', mod: '#b9c3c8', now: '#cbd3cd', unk: '#e8ddc6' };
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16) * f)},${Math.round((n >> 8 & 255) * f)},${Math.round((n & 255) * f)})`; }
const WALL = {}; ERAS.forEach(e => e.cols.forEach(c => WALL[c] = shade(c, .72)));
const THEME_COL = {};

/* ---------- camera ---------- */
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, s: .05 };
const toS = (x, y) => [(x - cam.x) * cam.s + W / 2, (y - cam.y) * cam.s + H / 2];
const toM = (X, Y) => [(X - W / 2) / cam.s + cam.x, (Y - H / 2) / cam.s + cam.y];
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; dirty(); }
function fitCity() { const [x0, y0, x1, y1] = B.bounds; cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2; cam.s = Math.min(W / (x1 - x0), H / (y1 - y0)) * .92; }
const SMIN = .02, SMAX = 7, BLD_Z = .85, TREE_Z = 1.6, LABEL_Z = 1.05;

/* ---------- tiles ---------- */
const TILESET = new Set(B.tiles), TILES = new Map(), LOADING = new Set();
function visibleTiles(pad = 1) {
  const [x0, y0] = toM(0, 0), [x1, y1] = toM(W, H), T = B.tile, out = [];
  for (let i = Math.floor(x0 / T) - pad; i <= Math.floor(x1 / T) + pad; i++) for (let j = Math.floor(y0 / T) - pad; j <= Math.floor(y1 / T) + pad; j++) { const k = `${i}_${j}`; if (TILESET.has(k)) out.push([i, j, k]); }
  return out;
}
function decodeTile(raw, i, j) {
  const T = B.tile, ox = i * T, oy = j * T, blds = [];
  raw.b.forEach((a, n) => { const pts = new Float32Array(a.length - 2); let x = 0, y = 0; for (let k = 2; k < a.length; k += 2) { x += a[k]; y += a[k + 1]; pts[k - 2] = ox + x / 2; pts[k - 1] = oy + y / 2; }
    let cy = 0; for (let k = 1; k < pts.length; k += 2) cy += pts[k]; cy /= pts.length / 2;
    const e = EK[eraOf(a[0])], col = e.cols[hash(i * 7919 + j * 104729 + n) % e.cols.length];
    blds.push({ y: a[0], lift: Math.min(28, Math.max(3, a[1] * .38)), pts, cy, col, wall: WALL[col] }); });
  blds.sort((p, q) => p.cy - q.cy);
  const tr = new Float32Array(raw.t.length); for (let k = 0; k < raw.t.length; k += 2) { tr[k] = ox + raw.t[k] / 2; tr[k + 1] = oy + raw.t[k + 1] / 2; }
  return { blds, trees: tr };
}
function ensureTiles() {
  if (cam.s < BLD_Z * .8) return;
  for (const [i, j, k] of visibleTiles(1)) {
    if (TILES.has(k) || LOADING.has(k)) continue;
    LOADING.add(k);
    fetch(`city/tiles/${k}.json`).then(r => r.json()).then(raw => { TILES.set(k, decodeTile(raw, i, j)); LOADING.delete(k); dirty(); }).catch(() => LOADING.delete(k));
  }
  if (TILES.size > 260) { const keep = new Set(visibleTiles(2).map(v => v[2])); for (const k of TILES.keys()) if (!keep.has(k)) TILES.delete(k); }
}

/* ---------- time filter ---------- */
let YEAR = null; // null = all years

/* ---------- drawing helpers ---------- */
function pathRing(r) { const [x, y] = toS(r[0][0], r[0][1]); ctx.moveTo(x, y); for (let k = 1; k < r.length; k++) { const p = r[k]; ctx.lineTo((p[0] - cam.x) * cam.s + W / 2, (p[1] - cam.y) * cam.s + H / 2); } ctx.closePath(); }
function inView(bb, m = 0) { const [a, b] = toS(bb[0], bb[1]), [c, d] = toS(bb[2], bb[3]); return c >= -m && a <= W + m && d >= -m && b <= H + m; }
B.parks.forEach(p => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; p.p.forEach(r => r.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); })); p.bb = [x0, y0, x1, y1]; });
B.streets.forEach(s => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; s.p.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }); s.bb = [x0, y0, x1, y1]; });

/* ---------- render ---------- */
let need = true; function dirty() { need = true; }
function render() {
  need = false;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = cam.s;
  ctx.fillStyle = '#b7cbcf'; ctx.fillRect(0, 0, W, H);
  // land with a soft coastline halo

  ctx.save(); ctx.shadowColor = 'rgba(80,110,115,.45)'; ctx.shadowBlur = 18; ctx.fillStyle = '#f4ecd9'; ctx.fill(); ctx.restore();

  dbody.innerHTML = `<div class="hd"><div class="k">${one ? `${fa ? fa.ids.size : S.filter(s => s.hood === FILTER.hood).length} stories · San Francisco` : `${S.length.toLocaleString()} stories · ${hoods.length} neighbourhoods`}</div><h2>${one ? esc(FILTER.hood) : 'Stories of San Francisco'}</h2><div class="sub">${one ? 'Its stories in order, oldest first. Hover a pin to preview.' : 'From the Yelamu to today, in order.'}</div>${fa && fa.extra ? fa.extra : ''}</div>
    <div class="bd"><div class="tfil"><select id="hoodSel"><option value="all">All neighbourhoods</option>${fa && fa.custom ? `<option selected>${esc(fa.n)}</option>` : ''}${hoods.map(h => `<option ${FILTER.hood === h ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></div>
    <div class="tfil"><button data-f="all" class="${FILTER.theme === 'all' ? 'on' : ''}">All themes</button>${Object.entries(TH).filter(([k]) => S.some(s => s.theme === k)).map(([k, v]) => `<button data-f="${k}" class="${FILTER.theme === k ? 'on' : ''}" style="border-left:4px solid ${v.color}">${esc(v.label)}</button>`).join('')}</div>
    <div class="stat">${CUR.length} stories</div>${CUR.slice(0, 250).map(card).join('')}${CUR.length > 250 ? `<div class="soon">Showing the first 250. Narrow by neighbourhood or theme to see more.</div>` : ''}</div>`;
  drawer.classList.add('open'); drawer.scrollTop = 0;
  dbody.querySelectorAll('.tfil button').forEach(b => b.onclick = () => { FILTER.theme = b.dataset.f; listStories(); });
  document.getElementById('hoodSel').onchange = e => { const v = e.target.value; if (v === 'all') { exitHood(); FILTER.hood = 'all'; listStories(); } else enterHood(v); };
}
dbody.addEventListener('click', e => { const c = e.target.closest('.scard'); if (c) openStory(c.dataset.sid); });
function openBlock(b) {
  const tot = Object.values(b.cnt).reduce((a, v) => a + v, 0);
  const ss = S.filter(s => s.block === b.id), lms = B.landmarks.filter(l => l.no && b.p.some(r => inside(l.c, r))), h = hoodOf([(b.bb[0] + b.bb[2]) / 2, (b.bb[1] + b.bb[3]) / 2]);
  dbody.innerHTML = `<div class="hd"><div class="k">${esc(h ? h.n : '')} · Block ${esc(b.id)}</div><h2>${esc(b.st.join(' & ') || 'A San Francisco block')}</h2><div class="sub">${b.n} parcels${b.old ? ` · oldest dated building ${b.old}` : ''}</div></div>
    <div class="bd"><div class="stat">When its buildings went up</div><div class="era-bar">${ERAS.filter(e => b.cnt[e.k]).map(e => `<i style="flex:${b.cnt[e.k]};background:${e.cols[0]}" title="${e.label}: ${b.cnt[e.k]}"></i>`).join('')}</div>
    <div>${ERAS.filter(e => b.cnt[e.k]).map(e => `<span class="chip">${e.label}: ${b.cnt[e.k]}</span>`).join('')}</div>
    ${lms.map(l => `<div class="lmcard"><b>★ ${esc(l.name)}</b><br><span class="stat">${esc(l.addr)} · City Landmark No. ${l.no}, designated ${l.year}</span>${l.doc ? `<br><a href="${esc(l.doc)}" target="_blank" rel="noopener">Designation report ↗</a>` : ''}</div>`).join('')}
    ${ss.length ? `<div class="stat" style="margin-top:18px">Stories on this block</div>${ss.map(card).join('')}` : `<div class="soon">No stories pinned to this block yet. Nearby pins may tell its neighbourhood's story.</div>`}</div>`;
  drawer.classList.add('open'); drawer.scrollTop = 0;
}
document.getElementById('close').onclick = () => { drawer.classList.remove('open'); SEL = null; HERE = null; NEAR = null; dirty(); };
document.getElementById('storiesBtn').onclick = () => { FILTER = { theme: 'all', hood: FOCUS ? FOCUS.n : 'all' }; listStories(); };
document.getElementById('tourBtn').onclick = () => { CUR = S; setYear(S[0].year); openStory(S[0].id, true); };

/* ---------- neighbourhood quick-jumps ---------- */
const QUICK = ['Alamo Square', 'Mission', 'Marina', 'Hayes Valley', 'Noe Valley'];
// areas that aren't official neighbourhoods but get the same focus view
const LL = (lon, lat) => [(lon - B.origin[0]) * Math.cos(B.origin[1] * Math.PI / 180) * 111320, -(lat - B.origin[1]) * 110540];
const AREAS = [{ n: 'Alamo Square', slug: 'alamo-square', p: [[LL(-122.4245, 37.78435), LL(-122.44751, 37.78107), LL(-122.44514, 37.76929), LL(-122.42224, 37.77293), LL(-122.4245, 37.78435)]], extra: '<a href="alamo.html" class="chip" style="text-decoration:none;margin-top:10px">See the hand-drawn Alamo Square map →</a>' }];
const areaOf = name => B.hoods.find(x => x.n === name) || AREAS.find(x => x.n === name);
const inArea = (st, a) => a.custom ? a.p.some(r => inside(st.c, r)) : st.hood === a.n;
AREAS.forEach(a => a.custom = true);
const quick = document.getElementById('quick'), backbar = document.getElementById('backbar');
quick.insertAdjacentHTML('beforeend', QUICK.map(n => `<button data-h="${esc(n)}">${esc(n)}</button>`).join('') +
  `<button id="moreH" title="All neighbourhoods">More ▾</button><select id="moreSel" style="display:none"><option value="">Choose a neighbourhood…</option>${[...B.hoods].map(h => h.n).sort().map(n => `<option>${esc(n)}</option>`).join('')}</select>`);
quick.querySelectorAll('button[data-h]').forEach(b => b.onclick = () => enterHood(b.dataset.h));
const moreSel = document.getElementById('moreSel');
document.getElementById('moreH').onclick = () => { moreSel.style.display = moreSel.style.display === 'none' ? '' : 'none'; if (moreSel.style.display === '') moreSel.focus(); };
moreSel.onchange = () => { if (moreSel.value) enterHood(moreSel.value); moreSel.style.display = 'none'; moreSel.value = ''; };
Object.assign(moreSel.style, { font: '500 12px Inter, system-ui, sans-serif', borderRadius: '999px', padding: '5px 8px', border: '1px solid #c9b58a', background: '#fbf5e6', color: '#3d3026' });
function hoodBox(h) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; h.p.forEach(r => r.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); })); return [x0, y0, x1, y1]; }
function enterHood(name, fromHash) {
  const h = areaOf(name); if (!h) return;
  h.ids = h.ids || new Set(S.filter(st => inArea(st, h)).map(st => st.id));
  FOCUS = h; HERE = null; NEAR = null; SEL = null;
  FILTER = { theme: 'all', hood: h.n }; listStories();
  const n = h.ids.size, [x0, y0, x1, y1] = hoodBox(h);
  document.getElementById('bbName').textContent = h.n; document.getElementById('bbStat').textContent = `${n} stories`;
  backbar.classList.add('on'); quick.classList.add('hide');
  quick.querySelectorAll('button[data-h]').forEach(b => b.classList.toggle('on', b.dataset.h === h.n));
  const room = [W - (W > 860 ? 470 : 0), H - 170], sc = Math.min(room[0] / (x1 - x0), room[1] / (y1 - y0)) * .9;
  flyTo((x0 + x1) / 2, (y0 + y1) / 2, Math.min(2, sc), 1100);
  if (!fromHash) history.pushState(null, '', '#hood=' + h.slug);
  dirty();
}
function exitHood(fromHash) {
  if (!FOCUS) return;
  FOCUS = null; backbar.classList.remove('on'); quick.classList.remove('hide'); FILTER = { theme: 'all', hood: 'all' };
  quick.querySelectorAll('button.on').forEach(b => b.classList.remove('on'));
  drawer.classList.remove('open'); SEL = null;
  const [x0, y0, x1, y1] = B.bounds; flyTo((x0 + x1) / 2, (y0 + y1) / 2, Math.min(W / (x1 - x0), H / (y1 - y0)) * .92, 1000);
  if (!fromHash) history.pushState(null, '', location.pathname + location.search);
  dirty();
}
document.getElementById('backBtn').onclick = () => exitHood();
addEventListener('keydown', e => { if (e.key === 'Escape' && FOCUS && document.activeElement !== sIn) exitHood(); });
addEventListener('popstate', () => { const m = location.hash.match(/hood=([\w-]+)/), h = m && [...B.hoods, ...AREAS].find(x => x.slug === m[1]); h ? enterHood(h.n, true) : exitHood(true); });

/* ---------- addresses (every SF address, loaded on first use) ---------- */
let ADDR = null, ADDR_P = null;
function loadAddr() {
  return ADDR_P || (ADDR_P = fetch('city/addr.json').then(r => r.json()).then(d => {
    ADDR = { streets: d.streets.map(([name, f]) => { const a = []; let n = 0, x = 0, y = 0; for (let k = 0; k < f.length; k += 3) { n += f[k]; x += f[k + 1]; y += f[k + 2]; a.push([n, x, y]); } return { name, low: name.toLowerCase(), a }; }), marks: d.marks };
    if (sIn.value.trim()) runSearch();
  }));
}
const ABBR = { street: 'st', avenue: 'ave', av: 'ave', boulevard: 'blvd', drive: 'dr', place: 'pl', terrace: 'ter', court: 'ct', lane: 'ln', road: 'rd', circle: 'cir', highway: 'hwy', alley: 'aly', plaza: 'plz', square: 'sq',
  first: '1st', second: '2nd', third: '3rd', fourth: '4th', fifth: '5th', sixth: '6th', seventh: '7th', eighth: '8th', ninth: '9th', tenth: '10th' };
function normQ(q) {
  return q.toLowerCase().split(',')[0].replace(/\b(san francisco|sf|ca|california)\b|\b94\d{3}\b/g, ' ').replace(/[.#]/g, ' ').replace(/\s+/g, ' ').trim()
    .split(' ').map(w => ABBR[w] || w).join(' ');
}
function streetMatches(txt) {
  if (!txt) return [];
  const out = [];
  for (const st of ADDR.streets) { let sc = st.low.startsWith(txt) ? 2 : (' ' + st.low).includes(' ' + txt) ? 1 : 0; if (sc) out.push([sc, st]); }
  return out.sort((p, q) => q[0] - p[0] || q[1].a.length - p[1].a.length).map(v => v[1]);
}
function addrHits(q) {
  const m = q.match(/^(\d+)\s*([a-z]?)\b\s*(.*)$/), hits = [];
  if (m) {
    const num = +m[1], txt = m[3] || '', sts = txt ? streetMatches(txt) : ADDR.streets.filter(st => st.a.some(v => v[0] === num)).sort((p, q) => q.a.length - p.a.length);
    for (const st of sts.slice(0, 40)) {
      const ex = st.a.find(v => v[0] === num);
      if (ex) hits.push({ label: `${num} ${st.name}`, x: ex[1], y: ex[2], sub: 'Address' });
      else if (txt) { const near = st.a.reduce((b, v) => Math.abs(v[0] - num) < Math.abs(b[0] - num) ? v : b); hits.push({ label: `${num} ${st.name}`, x: near[1], y: near[2], sub: `Closest listed address: ${near[0]} ${st.name}` }); }
      if (hits.length >= 7) break;
    }
  } else {
    for (const st of streetMatches(q).slice(0, 4)) { const mid = st.a[Math.floor(st.a.length / 2)]; hits.push({ label: st.name, x: mid[1], y: mid[2], sub: `Street · ${st.a[0][0]}–${st.a[st.a.length - 1][0]}` }); }
    for (const [n, ad, x, y] of ADDR.marks) if (n.toLowerCase().includes(q)) { hits.push({ label: n, x, y, sub: ad }); if (hits.length >= 7) break; }
  }
  return hits;
}
/* ---------- search ---------- */
const sIn = document.getElementById('search'), sRes = document.getElementById('results');
let HITS = [], ACT = -1;
function runSearch() {
  const raw = sIn.value.trim(), q = raw.toLowerCase(); if (q.length < 2) { sRes.classList.remove('on'); HITS = []; return; }
  HITS = []; const rows = [];
  if (ADDR) { const nq = normQ(raw), ah = addrHits(nq); if (ah.length) { rows.push('<div class="grp">Addresses & places</div>'); ah.forEach(h => { rows.push(`<div data-i="${HITS.length}"><b>${esc(h.label)}</b><small>${esc(h.sub)}</small></div>`); HITS.push({ t: 'a', ...h }); }); } }
  else if (/^\d/.test(q)) rows.push('<div class="grp">Loading addresses…</div>');
  const hs = B.hoods.filter(h => h.n.toLowerCase().includes(q)).slice(0, 4);
  if (hs.length) { rows.push('<div class="grp">Neighbourhoods</div>'); hs.forEach(h => { rows.push(`<div data-i="${HITS.length}"><b>${esc(h.n)}</b></div>`); HITS.push({ t: 'h', h }); }); }
  const ss = /^\d+\s/.test(q) ? [] : S.filter(s => (s.title + ' ' + s.place + ' ' + s.hook + ' ' + (s.people || []).map(p => p.name).join(' ')).toLowerCase().includes(q)).slice(0, 8);
  if (ss.length) { rows.push('<div class="grp">Stories</div>'); ss.forEach(s => { rows.push(`<div data-i="${HITS.length}"><b>${esc(s.title)}</b><small>${s.year} · ${esc(s.place)}</small></div>`); HITS.push({ t: 's', s }); }); }
  ACT = HITS.length ? 0 : -1;
  sRes.innerHTML = rows.join('') || '<div class="grp">No matches</div>'; sRes.classList.add('on'); markAct();
}
function markAct() { sRes.querySelectorAll('[data-i]').forEach(d => d.classList.toggle('act', +d.dataset.i === ACT)); const a = sRes.querySelector('.act'); if (a) a.scrollIntoView({ block: 'nearest' }); }
function pick(h) {
  sRes.classList.remove('on'); sIn.blur();
  if (h.t === 'a') { sIn.value = h.label; openNear(h.label, h.x, h.y); }
  else if (h.t === 's') openStory(h.s.id, true);
  else enterHood(h.h.n);
}
sIn.addEventListener('focus', () => { loadAddr(); if (sIn.value.trim()) runSearch(); });
sIn.addEventListener('input', runSearch);
sIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!HITS.length) return; ACT = (ACT + (e.key === 'ArrowDown' ? 1 : -1) + HITS.length) % HITS.length; markAct(); }
  else if (e.key === 'Enter' && HITS[ACT]) { e.preventDefault(); pick(HITS[ACT]); }
  else if (e.key === 'Escape') { sRes.classList.remove('on'); sIn.blur(); }
});
sRes.addEventListener('mousedown', e => e.preventDefault());
sRes.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) pick(HITS[+d.dataset.i]); });
document.addEventListener('click', e => { if (!e.target.closest('.results, .search')) sRes.classList.remove('on'); });

/* ---------- stories near a point ---------- */
function openNear(label, x, y) {
  if (FOCUS && !FOCUS.p.some(r => inside([x, y], r))) { FOCUS = null; backbar.classList.remove('on'); quick.classList.remove('hide'); FILTER.hood = 'all'; quick.querySelectorAll('button.on').forEach(b => b.classList.remove('on')); history.pushState(null, '', location.pathname); }
  const all = S.map(s => [s, Math.hypot(s.c[0] - x, s.c[1] - y)]).sort((a, b) => a[1] - b[1]);
  const near = all.filter(v => !OFF.has(v[0].theme)).slice(0, 12);
  HERE = { x, y, label }; NEAR = new Set(near.map(v => v[0].id)); SEL = null; CUR = near.map(v => v[0]);
  const b = blockAt([x, y]), h = hoodOf([x, y]);
  const dist = d => d < 1000 ? `${Math.round(d / 10) * 10} m · ${Math.max(1, Math.round(d / 80))} min walk` : `${(d / 1609).toFixed(1)} mi`;
  const era = b ? ERAS.filter(e => b.cnt[e.k]) : [], tot = b ? Object.values(b.cnt).reduce((a, v) => a + v, 0) : 0;
  dbody.innerHTML = `<div class="hd"><div class="k">${esc(h ? h.n : '')}</div><h2>Near ${esc(label)}</h2>
    <div class="sub">The ${near.length} closest stories${OFF.size ? ' in the themes you’ve chosen' : ''}</div></div>
    <div class="bd">${b ? `<div class="stat">This block: ${b.n} parcels${b.old ? `, oldest dated building ${b.old}` : ''}</div><div class="era-bar">${era.map(e => `<i style="flex:${b.cnt[e.k]};background:${e.cols[0]}" title="${e.label}: ${b.cnt[e.k]}"></i>`).join('')}</div>` : ''}
    ${near.map(([s, d]) => card(s).replace('<div class="m">', `<div class="m"><span class="near-d">${dist(d)}</span>`)).join('')}</div>`;
  drawer.classList.add('open'); drawer.scrollTop = 0;
  // frame the address with its nearest handful of stories
  const r = Math.max(120, near[Math.min(5, near.length - 1)][1]), room = Math.min(W - (W > 860 ? 470 : 0), H - 160) / 2;
  flyTo(x, y, Math.max(.6, Math.min(3.2, room * .85 / r)), 1000);
}
document.getElementById('meBtn').onclick = () => {
  if (!navigator.geolocation) return alert('Your browser can’t share your location.');
  navigator.geolocation.getCurrentPosition(p => {
    const x = (p.coords.longitude - B.origin[0]) * Math.cos(B.origin[1] * Math.PI / 180) * 111320, y = -(p.coords.latitude - B.origin[1]) * 110540;
    const [x0, y0, x1, y1] = B.bounds; if (x < x0 || x > x1 || y < y0 || y > y1) return alert('You seem to be outside San Francisco. Try searching an address instead.');
    openNear('you', x, y);
  }, () => alert('Couldn’t get your location. Try searching an address instead.'), { enableHighAccuracy: true, timeout: 10000 });
};

/* ---------- theme key: doubles as a map filter ---------- */
const tkey = document.getElementById('themekey');
function drawThemeKey() {
  const n = {}; S.forEach(s => n[s.theme] = (n[s.theme] || 0) + 1);
  tkey.innerHTML = `<h4 id="tkH"><span>Story themes</span><span>${tkey.classList.contains('min') ? '+' : '−'}</span></h4><div class="list">${Object.entries(TH).filter(([k]) => n[k]).map(([k, v]) => `<button data-k="${k}" class="${OFF.has(k) ? 'off' : ''}" title="Click to show only this theme; click again to show all"><i style="background:${v.color}"></i>${esc(v.label)}<span class="n">${n[k]}</span></button>`).join('')}
    ${OFF.size ? '<button class="all" id="tkAll">Show all themes</button>' : ''}</div>`;
  document.getElementById('tkH').onclick = () => { tkey.classList.toggle('min'); drawThemeKey(); };
  tkey.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, keys = Object.keys(TH).filter(t => n[t]), only = OFF.size === keys.length - 1 && !OFF.has(k);
    OFF = only ? new Set() : new Set(keys.filter(t => t !== k)); drawThemeKey(); dirty();
  });
  const all = document.getElementById('tkAll'); if (all) all.onclick = () => { OFF = new Set(); drawThemeKey(); dirty(); };
}
drawThemeKey();

/* ---------- time ---------- */
const ERA_TXT = [[1776, 'Yelamu homeland, the Presidio and Mission Dolores'], [1848, 'Gold Rush: a village becomes a city'], [1870, 'The Victorian city spreads west'], [1906, 'Earthquake, fire and rebuilding'], [1915, 'A world’s fair city'], [1941, 'Wartime boom'], [1950, 'Freeways and redevelopment'], [1965, 'Counterculture and liberation'], [1989, 'Loma Prieta and the new waterfront'], [2000, 'The city today']];
const slider = document.getElementById('slider'), allY = document.getElementById('allYears');
function setYear(y) { slider.value = y; allY.checked = false; applyYear(); }
function applyYear() { YEAR = allY.checked ? null : +slider.value; document.getElementById('yr').textContent = YEAR || 'All years'; document.getElementById('eraTxt').textContent = YEAR ? [...ERA_TXT].reverse().find(([a]) => YEAR >= a)[1] : 'Drag back in time'; dirty(); }
slider.addEventListener('input', () => { allY.checked = false; applyYear(); }); allY.addEventListener('change', applyYear);

/* ---------- legend + texture ---------- */
document.getElementById('legend').innerHTML = `<h4>When it was built</h4>` + ERAS.map(e => `<div class="row"><span class="sw" style="background:linear-gradient(90deg,${e.cols.slice(0, 3).join(',')})"></span>${e.label}</div>`).join('');
(function texture() { const c = document.createElement('canvas'); c.width = c.height = 200; const g = c.getContext('2d'), d = g.createImageData(200, 200); for (let i = 0; i < d.data.length; i += 4) { const v = 200 + Math.random() * 55; d.data[i] = v; d.data[i + 1] = v * .96; d.data[i + 2] = v * .88; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); document.getElementById('tex').style.background = `url(${c.toDataURL()})`; })();

/* ---------- loop ---------- */
function loop(t) { if (anim) anim(t); if (need) { ensureTiles(); render(); } requestAnimationFrame(loop); }
resize(); fitCity();
const hs = new URLSearchParams(location.hash.slice(1));
if (hs.get('hood')) { const h = [...B.hoods, ...AREAS].find(x => x.slug === hs.get('hood')); if (h) setTimeout(() => enterHood(h.n, true), 200); }
if (hs.get('story') && SBY[hs.get('story')]) setTimeout(() => openStory(hs.get('story'), true), 300);
document.getElementById('loading').remove();
requestAnimationFrame(loop);
</script>
